<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videtskih Movie Checker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f1115;
            color: #e2e8f0;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(168, 85, 247, 0.15), transparent 25%);
        }

        .glass-panel {
            background: rgba(30, 33, 40, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .neon-border:focus-within {
            box-shadow: 0 0 0 2px #6366f1, 0 0 15px rgba(99, 102, 241, 0.5);
            border-color: transparent;
        }

        .btn-check {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
            transition: all 0.3s ease;
        }
        
        .btn-check:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(168, 85, 247, 0.5);
        }

        .btn-check:active {
            transform: translateY(1px);
        }

        .result-success {
            text-shadow: 0 0 20px rgba(34, 197, 94, 0.6);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .result-error {
            text-shadow: 0 0 20px rgba(239, 68, 68, 0.6);
            animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both;
        }

        .result-info {
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); }
            20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
            40%, 60% { transform: translate3d(4px, 0, 0); }
        }

        .spinner {
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #fff;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }

        .hidden-element { display: none !important; }
        .line-clamp-4 { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>
<body class="p-4 sm:p-8">

    <main class="w-full max-w-2xl mx-auto flex flex-col gap-6">
        
        <div class="text-center mb-4">
            <h1 class="text-3xl sm:text-5xl font-black bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-purple-400 mb-2">
                Videtskih Movie Checker
            </h1>
            <p class="text-gray-400 text-sm sm:text-base">Смотрели ли мы этот фильм?</p>
        </div>

        <div class="glass-panel rounded-2xl p-5 sm:p-8 flex flex-col items-center">
            <div class="w-full relative">
                <div class="bg-gray-800/80 rounded-xl border border-gray-700 neon-border transition-all flex items-center px-4 py-1">
                    <svg class="w-6 h-6 text-indigo-400 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    <input type="text" id="movieInput" class="w-full bg-transparent py-4 outline-none text-lg text-white placeholder-gray-500" placeholder="Введите название фильма или аниме..." autocomplete="off">
                </div>
            </div>
            
            <button id="checkMovieBtn" class="btn-check w-full sm:w-auto mt-6 text-white font-bold text-lg py-4 px-12 rounded-xl shadow-lg flex justify-center items-center gap-3">
                <span id="btnText">Проверить</span>
                <div id="btnSpinner" class="spinner hidden-element"></div>
            </button>
        </div>

        <div id="resultContainer" class="glass-panel rounded-2xl p-6 sm:p-10 text-center hidden-element">
            
            <div id="movieCardInfo" class="mb-6 pb-6 border-b border-gray-700/50 hidden-element flex flex-col sm:flex-row items-center sm:items-start gap-6 text-left">
                <img id="resMoviePoster" src="" alt="Постер" class="w-32 sm:w-40 rounded-lg shadow-lg object-cover">
                <div class="w-full flex-1">
                    <h3 id="resMovieTitle" class="text-2xl font-bold text-white mb-2">Название фильма</h3>
                    <p class="text-gray-400 text-sm mb-1">Год: <span id="resMovieYear" class="text-gray-200"></span></p>
                    <p class="text-gray-400 text-sm mb-3">Рейтинг КП: ⭐ <span id="resMovieRating" class="text-gray-200 font-bold"></span></p>
                    <p id="resMovieDesc" class="text-gray-300 text-sm italic line-clamp-4"></p>
                </div>
            </div>

            <div id="verdictIcon" class="flex justify-center mb-4"></div>
            <h2 id="verdictTitle" class="text-2xl sm:text-3xl font-black mb-4 uppercase tracking-wide"></h2>
            
            <div id="reasonContainer" class="inline-block bg-gray-800/80 border border-gray-700 rounded-lg px-4 py-3 hidden-element mb-4">
                <p id="verdictReason" class="text-gray-300 font-medium"></p>
            </div>

            <!-- WB Warning -->
            <div id="wbWarning" class="inline-block bg-orange-500/20 border border-orange-500/50 rounded-lg px-4 py-3 hidden-element w-full text-center mt-2">
                <p class="text-orange-400 font-semibold flex flex-col sm:flex-row items-center justify-center gap-2">
                    <svg class="w-6 h-6 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                    <span>Обратите внимание! Присутствует упоминание Warner Bros! Перед заказом убедитесь, что это не WB!</span>
                </p>
            </div>
            
            <p id="errorMessage" class="text-red-400 mt-2 hidden-element"></p>
        </div>

        <div id="debugInfo" class="text-xs text-center text-gray-500 bg-gray-800/40 p-3 rounded-lg border border-gray-700/50 hidden-element"></div>

    </main>

    <script>
        // ================= НАСТРОЙКИ =================
        const KP_API_KEY = "ab5de608-2d16-4362-8e1b-22f05fc1c564"; 
        const OMDB_API_KEY = "cbe9adcf"; 
        const GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTeGf589-vK6qDVfY569rNL8k5Q_Nm4ZJBD6gC2YASrBzSuNFaEaASxV84IpfzCzUeSIJGJxP7gsjYA/pubhtml";
        // =============================================

        const DOM = {
            movieInput: document.getElementById('movieInput'),
            checkMovieBtn: document.getElementById('checkMovieBtn'),
            btnText: document.getElementById('btnText'),
            btnSpinner: document.getElementById('btnSpinner'),
            resultContainer: document.getElementById('resultContainer'),
            movieCardInfo: document.getElementById('movieCardInfo'),
            resMoviePoster: document.getElementById('resMoviePoster'),
            resMovieTitle: document.getElementById('resMovieTitle'),
            resMovieYear: document.getElementById('resMovieYear'),
            resMovieRating: document.getElementById('resMovieRating'),
            resMovieDesc: document.getElementById('resMovieDesc'),
            verdictIcon: document.getElementById('verdictIcon'),
            verdictTitle: document.getElementById('verdictTitle'),
            reasonContainer: document.getElementById('reasonContainer'),
            verdictReason: document.getElementById('verdictReason'),
            wbWarning: document.getElementById('wbWarning'),
            errorMessage: document.getElementById('errorMessage'),
            debugInfo: document.getElementById('debugInfo')
        };

        function init() {
            DOM.checkMovieBtn.addEventListener('click', handleCheckMovie);
            DOM.movieInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleCheckMovie();
            });
        }

        function setLoading(isLoading) {
            DOM.checkMovieBtn.disabled = isLoading;
            if (isLoading) {
                DOM.btnText.classList.add('hidden-element');
                DOM.btnSpinner.classList.remove('hidden-element');
                DOM.resultContainer.classList.add('hidden-element');
                DOM.errorMessage.classList.add('hidden-element');
                DOM.debugInfo.classList.add('hidden-element');
                DOM.wbWarning.classList.add('hidden-element');
            } else {
                DOM.btnText.classList.remove('hidden-element');
                DOM.btnSpinner.classList.add('hidden-element');
            }
        }

        function normalizeString(str) {
            if (!str) return '';
            return str.toLowerCase().replace(/[^a-zа-яё0-9]/gi, '');
        }

        function getCsvUrl(url) {
            let properUrl = url;
            if (properUrl.includes('/pubhtml')) {
                properUrl = properUrl.substring(0, properUrl.indexOf('/pubhtml')) + '/pub?output=csv';
            } else if (properUrl.includes('/edit')) {
                properUrl = properUrl.substring(0, properUrl.indexOf('/edit')) + '/export?format=csv';
            }
            return properUrl;
        }

        // --- УЛЬТИМАТИВНЫЙ ДЕТЕКТОР WARNER BROS ---
        async function isWarnerBros(query, movie, imdbId, kpDetailsText) {
            const wbRegex = /warner|уорнер|ворнер|нью лайн|new line cinema/i;
            
            // 1. Мгновенная локальная база (обновлена сложными фильмами)
            const WB_FRANCHISES = [
                "гарри поттер", "фантастические твари", "бэтмен", "джокер", "супермен", 
                "лига справедливости", "чудо-женщина", "аквамен", "шазам", "флэш", "отряд самоубийц",
                "харли квинн", "властелин колец", "хоббит", "матрица", "дюна", "безумный макс", 
                "оно", "заклятие", "проклятие аннабель", "монахиня", "мальчишник", "оушена", "годзилла", "конг", 
                "тихоокеанский рубеж", "шерлок холмс", "мортал комбат", "смертельное оружие", "довод", "начало", 
                "интерстеллар", "тёмный рыцарь", "скуби-ду", "том и джерри", "луни тюнз", "лего фильм", 
                "зодиак", "чарли и шоколадная фабрика", "полярный экспресс", "v значит вендетта", "бегущий по лезвию",
                "гравитация", "книга илая", "дюнкерк", "космический джем", "сияние", "цельнометаллическая оболочка",
                "заводной апельсин", "престиж", "зеленая миля", "побег из шоушенка"
            ];
            
            if (WB_FRANCHISES.some(f => query.toLowerCase().includes(f))) return true;
            if (movie && movie.nameRu && WB_FRANCHISES.some(f => movie.nameRu.toLowerCase().includes(f))) return true;

            // 2. Проверка описаний Кинопоиска
            if (wbRegex.test(kpDetailsText)) return true;

            // 3. Проверка OMDb API
            if (imdbId) {
                try {
                    const omdbRes = await fetch(`https://www.omdbapi.com/?i=${imdbId}&apikey=${OMDB_API_KEY}`);
                    if (omdbRes.ok) {
                        const omdb = await omdbRes.json();
                        if (omdb.Production && wbRegex.test(omdb.Production)) return true;
                        if (omdb.Company && wbRegex.test(omdb.Company)) return true;
                    }
                } catch(e) { console.warn("OMDb Check Error", e); }
            }

            // 4. ТЯЖЕЛАЯ АРТИЛЛЕРИЯ: Wikidata (Ищет Дистрибьютора по IMDb ID)
            if (imdbId) {
                try {
                    // SPARQL запрос: найти фильм по IMDb ID и вытащить его Производителя (P272) и Дистрибьютора (P750)
                    const sparqlQuery = `
                        SELECT ?cLabel WHERE { 
                          ?m wdt:P345 "${imdbId}". 
                          { ?m wdt:P272 ?c. } UNION { ?m wdt:P750 ?c. } 
                          SERVICE wikibase:label { bd:serviceParam wikibase:language "en". ?c rdfs:label ?cLabel } 
                        }
                    `;
                    const wdUrl = "https://query.wikidata.org/sparql?query=" + encodeURIComponent(sparqlQuery) + "&format=json";
                    const wdRes = await fetch(wdUrl, { headers: { "Accept": "application/sparql-results+json" } });
                    
                    if (wdRes.ok) {
                        const wdData = await wdRes.json();
                        for (let binding of wdData.results.bindings) {
                            if (binding.cLabel && wbRegex.test(binding.cLabel.value)) {
                                return true; // Найдено!
                            }
                        }
                    }
                } catch(e) { console.warn("Wikidata SPARQL Error", e); }
            }

            return false;
        }

        async function handleCheckMovie() {
            const query = DOM.movieInput.value.trim();
            if (!query) {
                DOM.movieInput.focus();
                return;
            }

            setLoading(true);

            try {
                let movie = null;
                let searchTerms = [normalizeString(query)];
                let imdbId = null;
                let kpDetailsText = "";
                let isWB = false;
                
                // --- ШАГ 1: Запрос к Кинопоиску ---
                try {
                    const kpUrl = `https://kinopoiskapiunofficial.tech/api/v2.1/films/search-by-keyword?keyword=${encodeURIComponent(query)}&page=1`;
                    const kpRes = await fetch(kpUrl, {
                        method: 'GET',
                        headers: { 'X-API-KEY': KP_API_KEY, 'Content-Type': 'application/json' }
                    });
                    
                    if (kpRes.ok) {
                        const kpData = await kpRes.json();
                        movie = kpData.films && kpData.films.length > 0 ? kpData.films[0] : null;
                        
                        if (movie) {
                            if (movie.nameRu) searchTerms.push(normalizeString(movie.nameRu));
                            if (movie.nameEn) searchTerms.push(normalizeString(movie.nameEn));

                            // Получаем детали из КП для IMDb ID
                            try {
                                const detailsUrl = `https://kinopoiskapiunofficial.tech/api/v2.2/films/${movie.filmId}`;
                                const detailsRes = await fetch(detailsUrl, {
                                    method: 'GET',
                                    headers: { 'X-API-KEY': KP_API_KEY, 'Content-Type': 'application/json' }
                                });
                                
                                if (detailsRes.ok) {
                                    const detailsData = await detailsRes.json();
                                    imdbId = detailsData.imdbId;
                                    kpDetailsText = (detailsData.description || '') + ' ' + (detailsData.shortDescription || '');
                                    if (detailsData.productionCompanies) {
                                        kpDetailsText += ' ' + detailsData.productionCompanies.map(c => c.name).join(' ');
                                    }
                                }
                            } catch (e) {
                                console.warn("Ошибка получения деталей с Кинопоиска:", e);
                            }
                        }
                    }
                } catch (e) {
                    console.error("Ошибка связи с Кинопоиском:", e);
                }

                // Запуск умного детектора Уорнеров
                isWB = await isWarnerBros(query, movie, imdbId, kpDetailsText);

                // --- ШАГ 2: Поиск в Гугл Таблице ---
                let isWatched = false;
                let rowsLength = 0;
                let tableDebugMsg = "";
                
                try {
                    const csvUrl = getCsvUrl(GOOGLE_SHEET_URL);
                    let csvText = "";

                    try {
                        const sheetRes = await fetch(csvUrl);
                        if (sheetRes.ok) {
                            csvText = await sheetRes.text();
                        } else {
                            throw new Error("Блокировка доступа");
                        }
                    } catch (e) {
                        const proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(csvUrl);
                        const proxyRes = await fetch(proxyUrl);
                        if (!proxyRes.ok) throw new Error("Прокси недоступен");
                        const proxyData = await proxyRes.json();
                        csvText = proxyData.contents;
                    }

                    if (csvText && csvText.toLowerCase().includes('<html')) {
                         tableDebugMsg = "⚠️ Ошибка: Гугл отдал веб-страницу.";
                    } else if (csvText) {
                        const rows = csvText.split('\n');
                        rowsLength = rows.length;
                        
                        let exactMatch = false;
                        let partialMatch = false;

                        searchTerms = [...new Set(searchTerms)].filter(t => t.length > 0);

                        for (let row of rows) {
                            const columns = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
                            for (let cell of columns) {
                                if (cell) {
                                    const cellVal = normalizeString(cell);
                                    if (cellVal.length < 2) continue; 
                                    
                                    for (let term of searchTerms) {
                                        if (cellVal === term) {
                                            exactMatch = true;
                                            break;
                                        }
                                        if (term.length > 5 && cellVal.length > 5) {
                                            if (cellVal.includes(term) || term.includes(cellVal)) {
                                                partialMatch = true;
                                                break;
                                            }
                                        }
                                    }
                                    if (exactMatch || partialMatch) break;
                                }
                            }
                            if (exactMatch || partialMatch) break;
                        }
                        
                        isWatched = exactMatch || partialMatch;
                        tableDebugMsg = `✅ Таблица проверена (строк: ${rowsLength}). <a href="${GOOGLE_SHEET_URL}" target="_blank" class="text-indigo-400 underline hover:text-indigo-300">Оригинальная таблица</a>`;
                    }
                } catch (err) {
                    tableDebugMsg = `⚠️ Ошибка чтения таблицы: ${err.message}.`;
                    console.error(err);
                }

                renderVerdict(isWatched, movie, query, tableDebugMsg, isWB);
            } catch (error) {
                console.error(error);
                showError(error.message || "Произошла неизвестная ошибка.");
            } finally {
                setLoading(false);
            }
        }

        function renderVerdict(isWatched, movie, originalQuery, tableDebugMsg, isWB) {
            DOM.resultContainer.classList.remove('hidden-element');
            DOM.errorMessage.classList.add('hidden-element');
            DOM.movieCardInfo.classList.remove('hidden-element');
            DOM.wbWarning.classList.add('hidden-element');

            DOM.debugInfo.innerHTML = tableDebugMsg;
            DOM.debugInfo.classList.remove('hidden-element');

            if (movie) {
                DOM.resMovieTitle.textContent = movie.nameRu || movie.nameEn || originalQuery;
                DOM.resMovieYear.textContent = movie.year || 'Неизвестно';
                DOM.resMovieRating.textContent = movie.rating && movie.rating !== 'null' ? movie.rating : '-';
                DOM.resMovieDesc.textContent = movie.description || 'Описание отсутствует.';
                DOM.resMoviePoster.src = movie.posterUrl || 'https://via.placeholder.com/150x220?text=Нет+постера';
            } else {
                DOM.resMovieTitle.textContent = 'Не найдено: ' + originalQuery;
                DOM.resMovieYear.textContent = '-';
                DOM.resMovieRating.textContent = '-';
                DOM.resMovieDesc.textContent = 'Не удалось найти информацию об этом фильме в базе Кинопоиска.';
                DOM.resMoviePoster.src = 'https://via.placeholder.com/150x220?text=Не+найдено';
            }

            DOM.verdictTitle.className = "text-2xl sm:text-3xl font-black mb-4 uppercase tracking-wide";
            void DOM.verdictTitle.offsetWidth; 
            
            DOM.reasonContainer.classList.add('hidden-element');

            let releaseYear = movie && movie.year ? parseInt(movie.year.split('-')[0]) : 0;

            if (isWatched) {
                DOM.verdictIcon.innerHTML = `
                    <div class="bg-blue-500/20 p-4 rounded-full">
                        <svg class="w-16 h-16 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    </div>`;
                DOM.verdictTitle.textContent = "Этот фильм мы уже смотрели";
                DOM.verdictTitle.classList.add('text-blue-400', 'result-info');
            } else {
                if (isWB) {
                    DOM.wbWarning.classList.remove('hidden-element');
                }

                if (movie && releaseYear > 2021) {
                    DOM.verdictIcon.innerHTML = `
                        <div class="bg-red-500/20 p-4 rounded-full">
                            <svg class="w-16 h-16 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>`;
                    DOM.verdictTitle.textContent = "Мы не смотрели, но не подходит по году";
                    DOM.verdictTitle.classList.add('text-red-500', 'result-error');
                    
                    DOM.reasonContainer.classList.remove('hidden-element');
                    DOM.verdictReason.textContent = `Год выпуска (${releaseYear}) больше 2021`;
                    DOM.verdictReason.classList.add('text-red-400');
                } else {
                    DOM.verdictIcon.innerHTML = `
                        <div class="bg-green-500/20 p-4 rounded-full">
                            <svg class="w-16 h-16 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        </div>`;
                    DOM.verdictTitle.textContent = "Этот фильм мы еще не смотрели";
                    DOM.verdictTitle.classList.add('text-green-500', 'result-success');
                }
            }
        }

        function showError(msg) {
            DOM.resultContainer.classList.remove('hidden-element');
            DOM.movieCardInfo.classList.add('hidden-element');
            DOM.verdictIcon.innerHTML = '';
            DOM.verdictTitle.textContent = '';
            DOM.reasonContainer.classList.add('hidden-element');
            DOM.wbWarning.classList.add('hidden-element');
            
            DOM.errorMessage.textContent = msg;
            DOM.errorMessage.classList.remove('hidden-element');
        }

        init();
    </script>
</body>
</html>
