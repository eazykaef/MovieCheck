<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поиск Фильмов</title>
    <style>
        :root {
            --primary: #8a2be2;
            --primary-dark: #4b0082;
            --bg-gradient: linear-gradient(135deg, #2b1055, #7597de);
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 50px;
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 28px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 16px;
            color: #333;
            outline: none;
        }

        button {
            padding: 15px 25px;
            border: none;
            border-radius: 10px;
            background: var(--primary);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: var(--primary-dark);
        }

        .loader {
            display: none;
            margin: 20px 0;
            font-style: italic;
        }

        .result-card {
            display: none;
            margin-top: 20px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 15px;
            padding: 20px;
            text-align: left;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .status-message {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
        }

        .status-watched { background: rgba(46, 204, 113, 0.3); border: 1px solid #2ecc71; }
        .status-not-watched { background: rgba(52, 152, 219, 0.3); border: 1px solid #3498db; }
        .status-wrong-year { background: rgba(231, 76, 60, 0.3); border: 1px solid #e74c3c; }

        .movie-info {
            display: flex;
            gap: 20px;
        }

        .poster {
            width: 150px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            object-fit: cover;
        }

        .details h2 { margin: 0 0 10px 0; }
        .details p { margin: 5px 0; font-size: 14px; line-height: 1.5; color: #ddd; }
        .desc { margin-top: 15px !important; font-style: italic; }

        @media (max-width: 500px) {
            .movie-info { flex-direction: column; align-items: center; }
            .poster { width: 200px; }
            .details { text-align: center; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🎬 Кино-чек</h1>
        <div class="search-box">
            <input type="text" id="movieInput" placeholder="Введите название фильма/аниме..." onkeypress="handleEnter(event)">
            <button onclick="checkMovie()">Искать</button>
        </div>

        <div id="loader" class="loader">Ищем информацию...</div>

        <div id="resultCard" class="result-card">
            <div id="statusMessage" class="status-message"></div>
            <div class="movie-info">
                <img id="moviePoster" class="poster" src="" alt="Постер">
                <div class="details">
                    <h2 id="movieTitle">Название</h2>
                    <p><strong>Год:</strong> <span id="movieYear"></span></p>
                    <p><strong>Рейтинг КП:</strong> ⭐ <span id="movieRating"></span></p>
                    <p class="desc" id="movieDesc">Описание фильма...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ================= НАСТРОЙКИ =================
        
        // 1. Ваш ключ Kinopoisk API Unofficial
        const KP_API_KEY = 'ab5de608-2d16-4362-8e1b-22f05fc1c564'; 
        
        // 2. Вставьте сюда ссылку на вашу таблицу в формате CSV
        const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTeGf589-vK6qDVfY569rNL8k5Q_Nm4ZJBD6gC2YASrBzSuNFaEaASxV84IpfzCzUeSIJGJxP7gsjYA/pubhtml';
        
        // 3. Колонки для поиска (B = 1, G = 6, L = 11)
        const SEARCH_COLUMNS = [1, 6, 11]; 
        
        // =============================================

        function handleEnter(e) {
            if (e.key === 'Enter') checkMovie();
        }

        async function checkMovie() {
            const query = document.getElementById('movieInput').value.trim();
            if (!query) return;

            const loader = document.getElementById('loader');
            const resultCard = document.getElementById('resultCard');
            
            loader.style.display = 'block';
            resultCard.style.display = 'none';

            try {
                // 1. Проверяем Гугл Таблицу
                const sheetRes = await fetch(GOOGLE_SHEET_CSV_URL);
                const csvText = await sheetRes.text();
                
                const rows = csvText.split('\n');
                let watchedMovies = [];

                rows.forEach(row => {
                    // Умное разделение CSV (игнорирует запятые внутри текста в кавычках)
                    const columns = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
                    
                    SEARCH_COLUMNS.forEach(colIndex => {
                        if (columns[colIndex]) {
                            // Очищаем от кавычек, лишних пробелов и приводим к нижнему регистру
                            const movieName = columns[colIndex].replace(/["\r]/g, '').trim().toLowerCase();
                            if (movieName) {
                                watchedMovies.push(movieName);
                            }
                        }
                    });
                });

                const isWatched = watchedMovies.includes(query.toLowerCase());

                // 2. Ищем фильм через Kinopoisk API Unofficial
                const kpUrl = `https://kinopoiskapiunofficial.tech/api/v2.1/films/search-by-keyword?keyword=${encodeURIComponent(query)}&page=1`;
                const kpRes = await fetch(kpUrl, {
                    method: 'GET',
                    headers: {
                        'X-API-KEY': KP_API_KEY,
                        'Content-Type': 'application/json',
                    }
                });
                
                const kpData = await kpRes.json();
                
                // В Unofficial API фильмы лежат в массиве "films"
                const movie = kpData.films && kpData.films.length > 0 ? kpData.films[0] : null;

                renderResult(isWatched, movie);
            } catch (error) {
                console.error(error);
                alert('Произошла ошибка! Проверьте правильность ссылки на Гугл Таблицу.');
            } finally {
                loader.style.display = 'none';
            }
        }

        function renderResult(isWatched, movie) {
            const resultCard = document.getElementById('resultCard');
            const statusMessage = document.getElementById('statusMessage');
            
            resultCard.style.display = 'block';
            statusMessage.className = 'status-message'; // Сброс классов

            // В Unofficial API год приходит как строка (например "2022"), переводим в число
            let releaseYear = movie && movie.year ? parseInt(movie.year.split('-')[0]) : 0;

            // Логика вывода сообщений
            if (isWatched) {
                statusMessage.textContent = 'Этот фильм мы уже смотрели ✅';
                statusMessage.classList.add('status-watched');
            } else if (movie && releaseYear > 2021) {
                statusMessage.textContent = 'Этот фильм мы не смотрели, но он не подходит по году ❌';
                statusMessage.classList.add('status-wrong-year');
            } else {
                statusMessage.textContent = 'Этот фильм мы еще не смотрели 🍿';
                statusMessage.classList.add('status-not-watched');
            }

            // Заполнение данных из Kinopoisk API Unofficial
            if (movie) {
                // Название (сначала русское, если нет - английское)
                document.getElementById('movieTitle').textContent = movie.nameRu || movie.nameEn || 'Без названия';
                document.getElementById('movieYear').textContent = movie.year || 'Неизвестно';
                document.getElementById('movieRating').textContent = movie.rating && movie.rating !== 'null' ? movie.rating : '-';
                
                // В поиске по ключевому слову API иногда отдает description, иногда нет
                document.getElementById('movieDesc').textContent = movie.description || 'Описание отсутствует (API не предоставило краткого описания).';
                
                const posterUrl = movie.posterUrl || 'https://via.placeholder.com/150x220?text=Нет+постера';
                document.getElementById('moviePoster').src = posterUrl;
            } else {
                // Если фильм не найден в базе API
                document.getElementById('movieTitle').textContent = 'Фильм не найден в базе';
                document.getElementById('movieYear').textContent = '-';
                document.getElementById('movieRating').textContent = '-';
                document.getElementById('movieDesc').textContent = 'Не удалось найти информацию об этом фильме.';
                document.getElementById('moviePoster').src = 'https://via.placeholder.com/150x220?text=Не+найдено';
            }
        }
    </script>
</body>
</html>
